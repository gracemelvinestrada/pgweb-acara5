<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="Leaflet.awesome-markers/dist/leaflet.awesome-markers.css" />
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://sig.sv.ugm.ac.id/" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-up-right-from-square"></i> SIG SV UGM</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i class="fa-solid fa-circle-info"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel"><i class="fa-solid fa-circle-info"></i> About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped table-bordered">
                        <tr>
                            <th width="40%">Nama</th>
                            <td>Grace Melvin Estrada</td>
                        </tr>
                        <tr>
                            <th>NIM</th>
                            <td>25/555837/SV/25853</td>
                        </tr>
                        <tr>
                            <th>Kelas</th>
                            <td>PGWEB B</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Jumlah Penduduk -->
    <div class="modal fade" id="featureModal" tabindex="-1" aria-labelledby="featureModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="featureModalTitle">Detail Penduduk</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="featureModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="Leaflet.awesome-markers/dist/leaflet.awesome-markers.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.368623367871784, 122.97615985785998], 11);

        // Map Panes
        map.createPane('pane_jumlah_penduduk');
        map.getPane('pane_jumlah_penduduk').style.zIndex = 300;

        map.createPane('pane_jalan');
        map.getPane('pane_jalan').style.zIndex = 400;

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // Scale Bar
        L.control.scale({
            position: "bottomleft",
            metric: true,
            imperial: false
        }).addTo(map);

        // GeoJSON Point toponimi
        var toponimi = L.geoJSON(null, {
            // Style
            pointToLayer: function (feature, latlng) {
                var iconName = "tag";
                var markerColor = "green";

                if (feature.properties.NAMA_UNSUR === "Gunung") {
                    iconName = "mountain";
                    markerColor = "darkred";
                } else if (feature.properties.NAMA_UNSUR === "Tanjung") {
                    iconName = "anchor";
                    markerColor = "orange";
                } else if (feature.properties.NAMA_UNSUR === "Teluk") {
                    iconName = "water";
                    markerColor = "blue";
                } else if (feature.properties.NAMA_UNSUR === "Toponimi") {
                    iconName = "tag";
                    markerColor = "green";
                }

                return L.marker(latlng, {
                    icon: L.AwesomeMarkers.icon({
                        icon: iconName,
                        prefix: "fa",
                        stylePrefix: "fa-solid",
                        markerColor: markerColor,
                        iconColor: "white",
                    }),
                });
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content =
                    "<img src= 'images/" + feature.properties.image + " 'alt='' width='200'>" + "<br>" +
                    "Nama: " + feature.properties.TOPONIMI + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " + feature.geometry.coordinates[0]
                    ;

                layer.on({
                    click: function (e) {
                        toponimi.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        toponimi.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },

        });

        $.getJSON("geojson/toponimi.geojson", function (data) {
            toponimi.addData(data); // Menambahkan data ke dalam GeoJSON Point toponimi
            map.addLayer(toponimi); // Menambahkan GeoJSON Point toponimi ke dalam peta
        });





        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: 'pane_jumlah_penduduk',
            // Style
            style: function (feature) {
                if (feature.properties.Penduduk <= 10000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#FFEEF8'
                    }
                }
                if (feature.properties.Penduduk > 10000 && feature.properties.Penduduk <= 20000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#FFA3DA'
                    }
                }
                if (feature.properties.Penduduk > 20000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#FF6CC4'
                    }
                }
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                layer.on({
                    click: function (e) {
                        var popup_content = "<table class='table table-striped table-bordered'>" +
                            "<tr><th>Kecamatan</th><td>" + feature.properties.WADMKC + "</td></tr>" +
                            "<tr><th>Kabupaten</th><td>" + (feature.properties.WADMKK || "-") + "</td></tr>" +
                            "<tr><th>Jumlah Penduduk</th><td>" + (feature.properties.Penduduk ? feature.properties.Penduduk.toLocaleString("id-ID") : "-") + " Jiwa</td></tr>" +
                            "<tr><th>Luas Wilayah</th><td>" + (feature.properties.luas_km2 ? feature.properties.luas_km2 + " km²" : "-") + "</td></tr>" +
                            "</table>";

                        document.getElementById("featureModalTitle").innerHTML = "Kecamatan " + feature.properties.WADMKC;
                        document.getElementById("featureModalBody").innerHTML = popup_content;

                        var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('featureModal'));
                        modal.show();
                    },
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.WADMKC, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });
        $.getJSON("geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data);
            map.addLayer(jumlah_penduduk);
            jalan.bringToFront();
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            pane: 'pane_jalan',
            // Style
            style: function (feature) {
                if (feature.properties.NAMA_UNSUR === "Jalan Propinsi") {
                    return {
                        color: "red",
                        weight: 3,
                        opacity: 1,
                    };
                }
                if (feature.properties.NAMA_UNSUR === "Jalan Kabupaten") {
                    return {
                        color: "red",
                        weight: 1.5,
                        dashArray: "10, 6",
                        opacity: 1,
                    };
                }
                if (feature.properties.NAMA_UNSUR === "Jalan Lain") {
                    return {
                        color: "red",
                        weight: 1.5,
                        dashArray: "3, 5",
                        opacity: 1,
                    };
                }
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (m): " + feature.properties.panjang_km;

                layer.on({
                    click: function (e) {
                        jalan.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jalan.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data);
            map.addLayer(jalan);
            jalan.bringToFront();
        });







        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var overlayMaps = {
            "Toponimi<br><div style='margin-left: 20px; font-size: 11px; line-height: 18px; margin-top: 3px;'><i class='fa-solid fa-mountain' style='color: #a23336; width: 14px;'></i> Gunung<br><i class='fa-solid fa-anchor' style='color: #f69730; width: 14px;'></i> Tanjung<br><i class='fa-solid fa-water' style='color: #38aadd; width: 14px;'></i> Teluk<br><i class='fa-solid fa-tag' style='color: #72b026; width: 14px;'></i> Toponimi</div>": toponimi,
            "Jalan<br><div style='margin-left: 20px; font-size: 11px; line-height: 18px; margin-top: 3px;'><svg width='20' height='6' style='vertical-align: middle; margin-right: 4px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='3'/></svg> Jalan Propinsi<br><svg width='20' height='6' style='vertical-align: middle; margin-right: 4px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='1.5' stroke-dasharray='6, 3'/></svg> Jalan Kabupaten<br><svg width='20' height='6' style='vertical-align: middle; margin-right: 4px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='1' stroke-dasharray='2, 2'/></svg> Jalan Lain</div>": jalan,
            "Jumlah Penduduk<br><div style='margin-left: 20px; font-size: 11px; line-height: 18px; margin-top: 3px;'><span style='background: #FFEEF8; width: 12px; height: 12px; display: inline-block; border: 1px solid black; vertical-align: middle; margin-right: 5px;'></span> &le; 10.000 Jiwa<br><span style='background: #FFA3DA; width: 12px; height: 12px; display: inline-block; border: 1px solid black; vertical-align: middle; margin-right: 5px;'></span> 10.001 - 20.000 Jiwa<br><span style='background: #FF6CC4; width: 12px; height: 12px; display: inline-block; border: 1px solid black; vertical-align: middle; margin-right: 5px;'></span> &gt; 20.000 Jiwa</div>": jumlah_penduduk
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);









    </script>





</body>

</html>
